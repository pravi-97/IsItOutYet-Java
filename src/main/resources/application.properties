spring.application.name=Is It Out Yet

spring.profiles.active=local

#actual url
#tmdb.base-url=https://api.themoviedb.org/3

tmdb.base-url=${TMDB_BASE_URL}
tvmaze.base-url=${TVMAZE_BASE_URL}
tmdb.token=${TMDB_TOKEN}

firebase.service-account-path=${FIREBASE_SERVICE_ACCOUNT_PATH}

# ===============================
# PostgreSQL Configuration
# ===============================
spring.datasource.url=${JDBC_URL}
spring.datasource.username=${JDBC_USER}
spring.datasource.password=${JDBC_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# ===============================
# JPA / Hibernate
# ===============================
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false