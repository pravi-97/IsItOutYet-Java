spring.application.name=Is It Out Yet
server.port=8080
spring.profiles.active=local
#spring.profiles.active=prod

#actual url
#tmdb.base-url=https://api.themoviedb.org/3

tmdb.base-url=${TMDB_BASE_URL}
tvmaze.base-url=${TVMAZE_BASE_URL}
tmdb.token=${TMDB_TOKEN}
zeptomail.api-key=${ZEPTOMAIL_API_KEY}

firebase.service-account=${FIREBASE_SERVICE_ACCOUNT}

notification.max.retries=${MAX_RETRIES}
zeptomail.from.address=${ZEPTO_FROM_ADDRESS}
zeptomail.from.name=${ZEPTO_FROM_NAME}

# ===============================
# PostgreSQL Configuration
# ===============================
spring.datasource.url=${JDBC_URL}
spring.datasource.username=${JDBC_USER}
spring.datasource.password=${JDBC_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# ===============================
# JPA / Hibernate
# ===============================
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

jobs.show-release-polling.cron=${SHOW_RELEASE_CRON}
jobs.notification-enqueue.cron=${NOTIFICATION_ENQUEUE_CRON}
jobs.email-send.cron=${EMAIL_SEND_CRON}
jobs.show-release-polling.enabled=true

spring.flyway.enabled=false

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS}